[project]
name = "torwords"
version = "0.1.0"
description = "Tor hides your IP, not your words: LLM attribute inference on SynthPAI"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
